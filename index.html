<!DOCTYPE html>
<html lang="pt-BR" data-escuro="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#201d19">
<title>Bíblia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icone-192.png">
<link rel="apple-touch-icon" href="assets/icons/icone-192.png">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

<!-- ícones reutilizados -->
<svg style="display:none">
  <symbol id="i-arvore" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" stroke-linecap="round"/></symbol>
  <symbol id="i-historico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" stroke-linecap="round"/><circle cx="9" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="10" cy="17" r="2.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-comparar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></symbol>
  <symbol id="i-marcador" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z" stroke-linejoin="round"/></symbol>
  <symbol id="i-livro" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M9 3v18" stroke-linecap="round"/></symbol>
  <symbol id="i-estudo" viewBox="0 0 24 24"><path d="M12 4L2 9l10 5 8-4v6" stroke-linejoin="round" stroke-linecap="round"/><path d="M6 12v4c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-4" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></symbol>
  <symbol id="i-compartilhar" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke-linecap="round"/></symbol>
  <symbol id="i-fixar" viewBox="0 0 24 24"><path d="M9 3h6l-1 7 3 3v2H7v-2l3-3z" stroke-linejoin="round"/><path d="M12 15v6" stroke-linecap="round"/></symbol>
  <symbol id="i-lixeira" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></symbol>
  <symbol id="i-antes" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-depois" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-nota" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" stroke-linejoin="round"/><path d="M14 3v4h4" stroke-linejoin="round"/><path d="M9 12h6M9 16h4" stroke-linecap="round"/></symbol>
  <symbol id="i-caderno" viewBox="0 0 24 24"><path d="M6 4h12a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke-linecap="round"/></symbol>
  <symbol id="i-negrito" viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z" stroke-linejoin="round"/></symbol>
  <symbol id="i-italico" viewBox="0 0 24 24"><path d="M10 5h8M6 19h8M14 5l-4 14" stroke-linecap="round"/></symbol>
  <symbol id="i-sublinhado" viewBox="0 0 24 24"><path d="M7 4v7a5 5 0 0 0 10 0V4M5 21h14" stroke-linecap="round"/></symbol>
  <symbol id="i-tachado" viewBox="0 0 24 24"><path d="M5 12h14" stroke-linecap="round"/><path d="M8 7a4 3 0 0 1 8 0M8 16a4 3 0 0 0 8 0" stroke-linecap="round"/></symbol>
  <symbol id="i-limpar-formato" viewBox="0 0 24 24"><path d="M8 6h11M9 6l-2 12M13 6l-1 6" stroke-linecap="round"/><path d="M14 16l6 5M20 16l-6 5" stroke-linecap="round"/></symbol>
  <symbol id="i-lapis" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" stroke-linejoin="round"/><path d="M14 6l4 4" stroke-linecap="round"/></symbol>
  <symbol id="i-ouvir" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pausar" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-vers-antes" viewBox="0 0 24 24"><rect x="5" y="5" width="2.4" height="14" rx="1" fill="currentColor" stroke="none"/><path d="M20 5l-10 7 10 7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-vers-depois" viewBox="0 0 24 24"><path d="M4 5l10 7-10 7z" fill="currentColor" stroke="none"/><rect x="16.6" y="5" width="2.4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
</svg>

<header class="topo">
  <button id="btn-arvore" title="Livros e capítulos" aria-label="Livros e capítulos">
    <svg class="icone"><use href="#i-livro"/></svg>
  </button>
  <button class="ref" id="btn-ref">Carregando</button>
  <button id="btn-atalho-fixado" class="atalho-fixado" title="Voltar ao fixado" aria-label="Voltar ao fixado" hidden>
    <svg class="icone"><use href="#i-fixar"/></svg>
  </button>
  <button id="btn-versao" title="Trocar versão"><span class="sigla" id="sigla-versao">—</span></button>
  <button id="btn-menu" title="Menu" aria-label="Menu">
    <svg class="icone"><use href="#i-menu"/></svg>
  </button>
</header>

<!-- menu do canto: reúne os painéis que não cabem na barra -->
<div class="menu-flutuante" id="menu-flutuante" aria-hidden="true">
  <button data-menu="busca"><svg class="icone"><use href="#i-busca"/></svg><span>Pesquisar</span></button>
  <button data-menu="historico"><svg class="icone"><use href="#i-historico"/></svg><span>Histórico</span></button>
  <button data-menu="marcadores"><svg class="icone"><use href="#i-marcador"/></svg><span>Marcadores</span></button>
  <button data-menu="estudos"><svg class="icone"><use href="#i-estudo"/></svg><span>Estudos</span></button>
  <button data-menu="caderno"><svg class="icone"><use href="#i-caderno"/></svg><span>Anotação</span></button>
  <button data-menu="ouvir"><svg class="icone"><use href="#i-ouvir"/></svg><span>Ouvir</span></button>
  <button data-menu="ajustes"><svg class="icone"><use href="#i-ajustes"/></svg><span>Ajustes</span></button>
  <button data-menu="compartilhar"><svg class="icone"><use href="#i-compartilhar"/></svg><span>Compartilhar</span></button>
</div>

<main class="folha" id="folha">
  <div class="estado">Abrindo a Bíblia…</div>
</main>

<!-- referências fixas: aparecem embaixo quando ligadas nos Ajustes -->
<div class="painel-refs-fixas" id="painel-refs-fixas" aria-hidden="true">
  <div class="cabeca-refs-fixas">
    <strong id="titulo-refs-fixas">Referências do capítulo</strong>
    <button id="desfixar-refs" class="desfixar-refs" aria-label="Desfixar referências da tela" title="Desfixar referências da tela">
      <svg class="icone"><use href="#i-fixar"/></svg>
    </button>
  </div>
  <div class="corpo-refs-fixas" id="corpo-refs-fixas"></div>
</div>

<!-- volta rápida: aparece ao pular para uma referência, para retornar num toque -->
<button class="voltar-origem" id="voltar-origem" hidden>
  <svg class="icone"><use href="#i-antes"/></svg>
  <span id="voltar-origem-texto">Voltar</span>
</button>

<!-- comparação lado a lado -->
<div class="comparador" id="comparador">
  <div class="metade" id="metade-a"></div>
  <div class="metade" id="metade-b"></div>
</div>

<!-- botão flutuante: liga/desliga a seleção de vários versículos -->
<button class="mais-selecao" id="mais-selecao" aria-pressed="false"
  aria-label="Selecionar vários versículos" title="Selecionar vários versículos" hidden>
  <svg class="icone" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"
    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
  <span class="mais-conta" id="mais-conta"></span>
</button>

<div class="barra-selecao" id="barra-selecao" aria-hidden="true">
  <div class="sel-topo">
    <span class="sel-ref" id="sel-ref"></span>
    <button id="sel-limpar" aria-label="Cancelar seleção">
      <svg class="icone"><use href="#i-fechar"/></svg></button>
  </div>
  <div class="sel-acoes">
    <button class="botao secundario" id="sel-copiar">Copiar</button>
    <button class="botao secundario" id="sel-compartilhar">Compartilhar</button>
    <button class="botao secundario" id="sel-estudo">Salvar estudo</button>
    <button class="botao secundario" id="sel-anotar">Anotar</button>
    <button class="botao" id="sel-marcar">Marcar</button>
  </div>
  <div class="sel-cores fechada" id="sel-cores"></div>
</div>

<!-- barra do player de leitura em voz (modo ouvir). Aparece quando o modo
     está ligado; enquanto isso, o app vira um player e o toque no versículo só
     reposiciona a leitura. -->
<div class="player-voz" id="player-voz" aria-hidden="true">
  <button class="player-x" id="player-fechar" aria-label="Fechar leitura" title="Fechar">
    <svg class="icone"><use href="#i-fechar"/></svg>
  </button>
  <div class="player-ref" id="player-ref"></div>
  <div class="player-botoes">
    <button class="player-bt" id="player-anterior" aria-label="Versículo anterior" title="Anterior">
      <svg class="icone"><use href="#i-vers-antes"/></svg>
    </button>
    <button class="player-bt player-grande" id="player-play" aria-label="Tocar" title="Tocar">
      <svg class="icone"><use href="#i-play"/></svg>
    </button>
    <button class="player-bt" id="player-proximo" aria-label="Próximo versículo" title="Próximo">
      <svg class="icone"><use href="#i-vers-depois"/></svg>
    </button>
  </div>
</div>

<footer class="rodape">
  <button id="btn-antes"><svg class="icone"><use href="#i-antes"/></svg> Anterior</button>
  <button class="meio" id="btn-comparar" title="Comparar duas versões">
    <svg class="icone"><use href="#i-comparar"/></svg> Comparar
  </button>
  <button id="btn-depois">Próximo <svg class="icone"><use href="#i-depois"/></svg></button>
</footer>

<div class="veu" id="veu"></div>

<!-- diálogo de confirmação, no tema do app (substitui o confirm() do navegador) -->
<div class="dialogo-veu" id="dialogo-veu" aria-hidden="true">
  <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">
    <strong id="dialogo-titulo"></strong>
    <p id="dialogo-mensagem"></p>
    <div class="dialogo-acoes">
      <button class="botao secundario" id="dialogo-cancelar">Cancelar</button>
      <button class="botao" id="dialogo-confirmar">Confirmar</button>
    </div>
  </div>
</div>

<!-- folha flutuante de leitura da anotação (abre pelo sinal no versículo).
     A folha rola por dentro; o X (canto superior direito) e o lápis (canto
     inferior direito) ficam fixos, sempre visíveis. O véu atrás escurece e,
     tocado, fecha. -->
<div class="visor-nota" id="visor-nota" aria-hidden="true">
  <div class="folha-visor" role="dialog" aria-modal="true" aria-label="Anotação">
    <button class="visor-fechar" id="visor-fechar" aria-label="Fechar">
      <svg class="icone"><use href="#i-fechar"/></svg>
    </button>
    <div class="visor-rolo" id="visor-rolo"></div>
    <button class="visor-lapis" id="visor-editar" aria-label="Editar anotação" title="Editar">
      <svg class="icone"><use href="#i-lapis"/></svg>
    </button>
  </div>
</div>

<!-- ------------------------------------------------------------- painéis -->

<aside class="painel" id="painel-arvore" aria-hidden="true">
  <header>
    <h2 id="titulo-arvore">Livros</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-arvore"></div>
</aside>

<aside class="painel" id="painel-versao" aria-hidden="true">
  <header>
    <h2 id="titulo-versao">Versão</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-versao"></div>
</aside>

<aside class="painel" id="painel-busca" aria-hidden="true">
  <header>
    <h2>Buscar</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo">
    <input class="campo" id="campo-busca" type="search" placeholder="Palavra ou expressão" autocomplete="off">
    <div class="filtros" id="filtros-busca"></div>
    <div id="resultados-busca">
      <div class="estado">Digite para buscar no texto da versão aberta.<br>Use os filtros para estreitar por parte da Bíblia.</div>
    </div>
  </div>
</aside>

<aside class="painel" id="painel-marcadores" aria-hidden="true">
  <header>
    <h2 id="titulo-marcadores">Marcadores</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-marcadores"></div>
</aside>

<aside class="painel" id="painel-historico" aria-hidden="true">
  <header>
    <h2>Histórico</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-historico"></div>
</aside>

<aside class="painel" id="painel-estudos" aria-hidden="true">
  <header>
    <h2 id="titulo-estudos">Estudos</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-estudos"></div>
</aside>

<aside class="painel" id="painel-salvar-estudo" aria-hidden="true">
  <header>
    <h2 id="titulo-salvar">Salvar estudo</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-salvar-estudo"></div>
</aside>

<aside class="painel" id="painel-caderno" aria-hidden="true">
  <header>
    <h2>Anotação</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-caderno"></div>
</aside>

<aside class="painel" id="painel-anot" aria-hidden="true">
  <header>
    <h2 id="titulo-anot">Anotações</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-anot"></div>
</aside>

<aside class="painel" id="painel-ajustes" aria-hidden="true">
  <header>
    <h2>Ajustes</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-ajustes"></div>
</aside>

<aside class="painel" id="painel-compartilhar" aria-hidden="true">
  <header>
    <h2>Compartilhar</h2>
    <button data-fechar aria-label="Fechar"><svg class="icone"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="corpo" id="corpo-compartilhar"></div>
</aside>

<!-- tirinha: um versículo em várias versões, empilhadas -->
<section class="tirinha" id="tirinha" aria-hidden="true">
  <header>
    <strong id="tirinha-ref">—</strong>
    <button class="botao secundario" id="tirinha-acoes" style="margin-left:auto;padding:7px 12px;font-size:13px">Ações</button>
    <button id="tirinha-fixar" class="botao-cab-tirinha" aria-label="Fixar referências na tela" title="Fixar referências na tela" hidden><svg class="icone"><use href="#i-fixar"/></svg></button>
    <button data-fechar-tirinha class="botao-cab-tirinha" aria-label="Fechar"><svg class="icone" style="stroke:var(--tinta)"><use href="#i-fechar"/></svg></button>
  </header>
  <div class="abas-tirinha">
    <button class="aba-tirinha ativa" data-aba="versoes">Versões</button>
    <button class="aba-tirinha" data-aba="refs">Referências</button>
  </div>
  <div class="corpo" id="tirinha-corpo"></div>
</section>

<script src="assets/js/dados.js"></script>
<script src="assets/js/armazenamento.js"></script>
<script src="assets/js/cores.js"></script>
  <script src="assets/js/leitura.js"></script>
<script src="assets/js/busca.js"></script>
<script src="assets/js/voz.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
